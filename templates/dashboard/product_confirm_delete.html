{% extends "dashboard/base.html" %}

{% block dashboard_title %}Удаление товара{% endblock %}

{% block dashboard %}
<h1 class="catalog-heading">Удаление товара</h1>

<div class="dashboard-confirm">
    <p>Вы действительно хотите удалить товар «{{ product.name }}»? Это действие необратимо.</p>

    <form method="post">
        {% csrf_token %}
        <div class="dashboard-form-actions">
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a class="btn btn-outline" href="{% url 'dashboard:product_list' %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
